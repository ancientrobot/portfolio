        : { position: 'absolute', inset: 0, background: 'repeating-linear-gradient(135deg, #463f31 0 16px, #554c3c 16px 32px)' },
      handleStyle: { position: 'absolute', top: 0, bottom: 0, left: pct + '%', width: '2px', background: '#E8702A', display: 'flex', alignItems: 'center', justifyContent: 'center', marginLeft: '-1px' },
      onPointerDown: (e) => { e.currentTarget.setPointerCapture(e.pointerId); this.setState({ dragging: true }); this.setFromClientX(e.clientX); },
      onPointerMove: (e) => { if (this.state.dragging) this.setFromClientX(e.clientX); },
      onPointerUp: () => this.setState({ dragging: false }),
      onRange: (e) => this.setState({ pct: parseFloat(e.target.value) }),
      prevHref: 'piece.html?id=' + prev.id,
      nextHref: 'piece.html?id=' + next.id,
      prevTitle: prev.title,
      nextTitle: next.title,
      prevArrowStyle: Object.assign({}, arrowBase, { left: arrowInset + 'px' }),
      nextArrowStyle: Object.assign({}, arrowBase, { right: arrowInset + 'px' }),
      contentWrapStyle: narrow
        ? { margin: '0 auto', padding: '0 clamp(18px, 5vw, 64px) clamp(40px, 8vh, 90px)' }
        : { maxWidth: (1440 - arrowSize * 2 - arrowInset * 2) + 'px', margin: '0 auto', padding: '0 clamp(18px, 5vw, 64px) clamp(40px, 8vh, 90px)' },
      mobileNavBtnStyle: { flex: '1 1 0', minHeight: '48px', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '8px', borderRadius: '8px', background: '#3d3a38', color: '#f4f1ed', fontSize: '14px', transition: 'background 0.15s, color 0.15s' }
    };
  }
}

</script>
